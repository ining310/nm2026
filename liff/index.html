<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 智慧回收機</title>
  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg:          #F7F9FC;
      --surface:     #FFFFFF;
      --border:      #E2E8F0;
      --border-focus:#1E3A5F;

      --text-primary:   #0D1F35;   /* blue-black */
      --text-secondary: #4A6082;
      --text-muted:     #8FA3BC;

      --accent:      #1E3A5F;      /* deep navy */
      --accent-hover:#16304F;
      --accent-light:#EEF3FA;

      --success-bg:  #F0F7F4;
      --success-border: #A7C9B9;
      --success-text:#14563C;

      --error-text:  #B91C1C;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    /* ── Base ────────────────────────────────────────────────── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                   "Helvetica Neue", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px 48px;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Card ────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      box-shadow: none;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-light);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg { display: block; }
    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    .subtitle {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* ── Divider ─────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 0 24px;
    }

    /* ── Field ───────────────────────────────────────────────── */
    .field { margin-bottom: 20px; }
    .field-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .field-label svg { flex-shrink: 0; }
    .input-wrap { position: relative; }
    input[type="text"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-family: "SF Mono", "Fira Code", "Fira Mono", monospace;
      color: var(--text-primary);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
      letter-spacing: 0.01em;
    }
    input[type="text"]::placeholder { color: var(--text-muted); font-family: inherit; }
    input[type="text"]:focus { border-color: var(--border-focus); }
    .field-hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    /* ── Demo wallets ───────────────────────────────────────── */
    .demo-wallets { margin-bottom: 10px; }
    .demo-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .demo-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .demo-btn {
      width: auto;
      padding: 5px 12px;
      background: var(--accent-light);
      color: var(--accent);
      border: 1.5px solid #C8D9EE;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .demo-btn:not(:disabled):hover { background: #dce8f5 !important; border-color: var(--accent); color: var(--accent); }
    .demo-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Fee row ─────────────────────────────────────────────── */
    .fee-row {
      background: var(--accent-light);
      border: 1px solid #C8D9EE;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .fee-row svg { flex-shrink: 0; margin-top: 1px; }
    .fee-body { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.6; }
    .fee-body strong { color: var(--text-primary); font-weight: 700; }
    .fee-reward {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Button ──────────────────────────────────────────────── */
    button {
      width: 100%;
      padding: 13px 20px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, opacity 0.15s;
    }
    button:not(:disabled):hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── Status message ──────────────────────────────────────── */
    #msg {
      margin-top: 14px;
      font-size: 0.82rem;
      line-height: 1.5;
      min-height: 1.2em;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      color: var(--text-secondary);
    }
    #msg svg { flex-shrink: 0; margin-top: 1px; }
    #msg.error { color: var(--error-text); }
    #msg.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    #msg.hidden { display: none; }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spin {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="header-icon">
        <!-- Recycle icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="#1E3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <polyline points="23 20 23 14 17 14"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </div>
      <h1>AI 智慧回收機</h1>
    </div>
    <p class="subtitle">掃碼成功。請填入您的 IOTA 錢包地址，分類成功即可獲得獎勵。</p>

    <div class="divider"></div>

    <!-- Wallet input -->
    <div class="field">
      <div class="field-label">
        <!-- Wallet icon -->
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 12V22H4V12"/>
          <path d="M22 7H2v5h20V7z"/>
          <path d="M12 22V7"/>
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
        </svg>
        獎勵錢包地址
      </div>

      <!-- Demo wallet quick-select -->
      <div class="demo-wallets">
        <p class="demo-label">選擇測試錢包（或在下方自行填入）</p>
        <div class="demo-btns">
          <button type="button" class="demo-btn" onclick="selectDemo(0)">錢包 A</button>
          <button type="button" class="demo-btn" onclick="selectDemo(1)">錢包 B</button>
          <button type="button" class="demo-btn" onclick="selectDemo(2)">錢包 C</button>
          <button type="button" class="demo-btn" onclick="selectDemo(3)">錢包 D</button>
        </div>
      </div>

      <div class="input-wrap">
        <input
          type="text"
          id="wallet"
          placeholder="0x…"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
        />
      </div>
      <p class="field-hint">IOTA Rebased devnet 地址（0x + 64 位十六進位）</p>
    </div>

    <!-- Fee summary -->
    <div class="fee-row">
      <!-- Info icon -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="#1E3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
      <div>
        <div class="fee-body">
          分類成功獲得 <strong>3 IOTA</strong> 獎勵
        </div>
        <div class="fee-reward">AI 判斷可回收且信心度 ≥ 80% 才發放，交易上鏈可供查驗</div>
      </div>
    </div>

    <!-- Pay button -->
    <button id="payBtn" onclick="pay()">
      <!-- Arrow-right icon -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
      確認投遞
    </button>

    <!-- Status -->
    <div id="msg" class="hidden"></div>

  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
