<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 智慧回收機</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #F7F9FC;
      --surface:     #FFFFFF;
      --border:      #E2E8F0;
      --border-focus:#1E3A5F;

      --text-primary:   #0D1F35;
      --text-secondary: #4A6082;
      --text-muted:     #8FA3BC;

      --accent:      #1E3A5F;
      --accent-hover:#16304F;
      --accent-light:#EEF3FA;
      --accent-btn:  #2C5282;

      --success-bg:     #F0F7F4;
      --success-border: #A7C9B9;
      --success-text:   #14563C;
      --error-text:     #B91C1C;

      --radius-sm: 8px;
      --radius-md: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                   "Helvetica Neue", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      padding-bottom: calc(68px + env(safe-area-inset-bottom));
    }

    .page {
      padding: 28px 20px 8px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
    }
    .header-icon {
      width: 32px; height: 32px; background: var(--accent-light);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; }
    .subtitle {
      font-size: 0.82rem; color: var(--text-secondary);
      margin-bottom: 24px; line-height: 1.5;
    }

    /* ── Steps card ──────────────────────────────────────────────── */
    .steps {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .step {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
    }
    .step + .step { border-top: 1px solid var(--border); }
    .step-num {
      width: 22px; height: 22px; background: var(--accent); color: #fff;
      border-radius: 50%; font-size: 0.72rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .step-body { flex: 1; min-width: 0; }
    .step-title { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .step-desc  { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; line-height: 1.5; }

    /* Step 1: wallet section indented to align with title */
    .step-wallet-content {
      margin-top: 10px;
      padding-left: 34px; /* 22px num + 12px gap */
      width: 100%;        /* flex-start parent won't stretch children */
    }

    /* ── Demo wallets ───────────────────────────────────────────── */
    .demo-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 6px; }
    .demo-btns  { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .demo-btn {
      width: auto !important; padding: 5px 12px !important;
      background: var(--accent-light) !important; color: var(--accent) !important;
      border: 1.5px solid #C8D9EE !important; border-radius: var(--radius-sm) !important;
      font-size: 0.78rem !important; font-weight: 600 !important;
      letter-spacing: 0; cursor: pointer; transition: background 0.15s;
    }
    .demo-btn:not(:disabled):hover {
      background: #dce8f5 !important; border-color: var(--accent) !important;
      color: var(--accent) !important;
    }
    /* active: keep dark bg even on hover */
    .demo-btn.active,
    .demo-btn.active:hover {
      background: var(--accent) !important; color: #fff !important;
      border-color: var(--accent) !important;
    }

    /* ── Wallet input ────────────────────────────────────────────── */
    input[type="text"] {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.82rem; font-family: "SF Mono", "Fira Code", monospace;
      color: var(--text-primary); background: var(--surface); outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]::placeholder { color: var(--text-muted); font-family: inherit; }
    input[type="text"]:focus { border-color: var(--border-focus); }
    .field-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }

    /* ── Pay button ──────────────────────────────────────────────── */
    button {
      width: 100%; padding: 13px 20px;
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius-md); font-size: 0.92rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.15s, opacity 0.15s;
    }
    button:not(:disabled):hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    #payBtn {
      background: var(--accent-btn);
      margin-top: 12px;
      animation: pay-pulse 2.5s ease-in-out infinite;
    }
    #payBtn:not(:disabled):hover {
      background: var(--accent);
      animation: none;
    }
    #payBtn:disabled { animation: none; }
    @keyframes pay-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(44,82,130,0.45); }
      55%       { box-shadow: 0 0 0 7px rgba(44,82,130,0); }
    }

    /* ── Status message ──────────────────────────────────────────── */
    #msg {
      margin-top: 12px; font-size: 0.82rem; line-height: 1.5;
      display: flex; align-items: flex-start; gap: 7px; color: var(--text-secondary);
    }
    #msg svg { flex-shrink: 0; margin-top: 1px; }
    #msg.error { color: var(--error-text); }
    #msg.success {
      background: var(--success-bg); border: 1px solid var(--success-border);
      color: var(--success-text); border-radius: var(--radius-sm); padding: 10px 12px;
    }
    #msg.hidden { display: none; }

    /* ── Spinner ─────────────────────────────────────────────────── */
    .spin {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Categories reference ────────────────────────────────────── */
    .categories {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); overflow: hidden;
    }
    .cat-row {
      display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px;
    }
    .cat-row + .cat-row { border-top: 1px solid var(--border); }
    .cat-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.73rem; font-weight: 600; flex-shrink: 0;
      padding-top: 1px;
    }
    .cat-badge.yes { color: #15643C; }
    .cat-badge.no  { color: #B91C1C; }
    .cat-items {
      font-size: 0.78rem; color: var(--text-secondary); line-height: 1.55;
    }

    /* ── Bottom tab bar ──────────────────────────────────────────── */
    .tab-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
    }
    .tab-btn {
      flex: 1; width: auto !important; padding: 10px 0 !important;
      background: none !important; border: none !important; border-radius: 0 !important;
      font-size: 0.76rem !important; font-weight: 500 !important;
      color: var(--text-muted) !important; letter-spacing: 0;
      display: flex !important; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px !important;
      cursor: pointer; transition: color 0.15s; opacity: 1 !important;
    }
    .tab-btn:not(:disabled):hover { background: none !important; color: var(--accent) !important; }
    .tab-btn.active { color: var(--accent) !important; font-weight: 700 !important; }
    .tab-btn.active svg { stroke: var(--accent); }
    .tab-btn:not(.active) svg { stroke: var(--text-muted); }

    /* ── History: balance card ───────────────────────────────────── */
    .balance-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px 20px;
      margin-bottom: 20px; display: block; text-decoration: none;
      transition: border-color 0.15s;
    }
    .balance-card:hover { border-color: var(--accent); }
    .balance-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .balance-label {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-secondary);
      display: flex; align-items: center; gap: 5px;
    }
    .balance-explorer-hint {
      font-size: 0.72rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 3px;
    }
    .balance-amount {
      font-size: 2.6rem; font-weight: 700; color: var(--accent);
      letter-spacing: -0.03em; line-height: 1;
    }
    .balance-unit { font-size: 1rem; font-weight: 500; color: var(--text-secondary); margin-left: 4px; }
    .balance-address {
      font-size: 0.68rem; color: var(--text-muted);
      font-family: "SF Mono", "Fira Code", monospace;
      margin-top: 6px; word-break: break-all;
    }

    /* ── History: stats row ──────────────────────────────────────── */
    .balance-stats {
      display: flex; gap: 0;
      border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px;
    }
    .balance-stat {
      flex: 1; text-align: center; padding: 0 4px;
    }
    .balance-stat + .balance-stat {
      border-left: 1px solid var(--border);
    }
    .balance-stat-value {
      font-size: 1.15rem; font-weight: 700; color: var(--accent);
      display: block; line-height: 1.2;
    }
    .balance-stat-label {
      font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; display: block;
    }

    /* ── Section label ───────────────────────────────────────────── */
    .section-label {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
    }

    /* ── History: session row ────────────────────────────────────── */
    .session-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 8px;
      display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start;
    }
    .session-icon {
      width: 28px; height: 28px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .session-icon.green { background: #EBF5EE; }
    .session-icon.red   { background: #FEF2F2; }
    .session-icon.gray  { background: #F1F5F9; }
    .session-body { min-width: 0; }
    .session-top  { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .session-title {
      font-size: 0.88rem; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip-mine {
      display: inline-flex; align-items: center;
      background: var(--accent-light); color: var(--accent);
      border: 1px solid #C8D9EE; border-radius: 4px;
      font-size: 0.68rem; font-weight: 700; padding: 1px 5px; flex-shrink: 0;
    }
    .session-meta {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 0.73rem; color: var(--text-muted);
    }
    .reward-green { color: #15643C; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .reward-gray  { color: var(--text-muted); }
    .explorer-link {
      display: inline-flex; align-items: center; color: var(--text-muted);
      text-decoration: none; transition: color 0.15s;
    }
    .explorer-link:hover { color: var(--accent); }

    .empty-msg { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 32px 0; }
  </style>
</head>
<body>

  <!-- ══ Tab 1: 投遞 ═══════════════════════════════════════════════ -->
  <div id="tab-pay" class="page">

    <div class="header">
      <div class="header-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="#1E3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <polyline points="23 20 23 14 17 14"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </div>
      <h1>AI 智慧回收機</h1>
    </div>
    <p class="subtitle">掃碼成功。依照步驟完成投遞，分類成功即獲得 IOTA 獎勵。</p>

    <div class="steps">

      <!-- Step 1 -->
      <div class="step" style="flex-direction:column;gap:0">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div class="step-num">1</div>
          <div class="step-body">
            <div class="step-title">填入獎勵錢包地址</div>
            <div class="step-desc">選擇測試錢包，或填入自己的 IOTA Rebased devnet 地址</div>
          </div>
        </div>
        <div class="step-wallet-content">
          <p class="demo-label">選擇測試錢包</p>
          <div class="demo-btns">
            <button type="button" class="demo-btn" onclick="selectDemo(0)">錢包 A</button>
            <button type="button" class="demo-btn" onclick="selectDemo(1)">錢包 B</button>
            <button type="button" class="demo-btn" onclick="selectDemo(2)">錢包 C</button>
            <button type="button" class="demo-btn" onclick="selectDemo(3)">錢包 D</button>
          </div>
          <input
            type="text" id="wallet" placeholder="0x…"
            autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
          />
          <p class="field-hint">0x + 64 位十六進位</p>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step" style="flex-direction:column;gap:0">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <div class="step-num">2</div>
          <div class="step-body">
            <div class="step-title">確認投遞，放上物品後按機台按鈕</div>
            <div class="step-desc">先送出登記，再將物品放到偵測平台並按下按鈕</div>
          </div>
        </div>
        <div class="step-wallet-content">
          <button id="payBtn" onclick="pay()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
            確認投遞
          </button>
          <div id="msg" class="hidden"></div>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-body">
          <div class="step-title">AI 辨識完成，自動發放獎勵</div>
          <div class="step-desc">判斷可回收且信心度 ≥ 80%，獲得 <strong>3 IOTA</strong> 匯入錢包，同時收到 LINE 通知</div>
        </div>
      </div>

    </div>

    <!-- Categories reference -->
    <div class="categories">
      <div class="cat-row">
        <span class="cat-badge yes">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          可獲獎
        </span>
        <span class="cat-items">金屬罐・塑膠瓶・紙類・玻璃</span>
      </div>
      <div class="cat-row">
        <span class="cat-badge no">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          不符合
        </span>
        <span class="cat-items">一般垃圾・混合類別・無法辨識</span>
      </div>
    </div>

  </div>

  <!-- ══ Tab 2: 歷史 ═══════════════════════════════════════════════ -->
  <div id="tab-history" class="page" style="display:none">

    <a class="balance-card" id="balance-link" href="#" target="_blank" rel="noopener">
      <div class="balance-top">
        <div class="balance-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/>
            <path d="M12 22V7"/>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
          </svg>
          IOTA 錢包餘額
        </div>
        <div class="balance-explorer-hint">
          查看我的錢包
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </div>
      </div>
      <div>
        <span class="balance-amount" id="balance-amount">—</span>
        <span class="balance-unit">IOTA</span>
      </div>
      <div class="balance-address" id="balance-address-text"></div>
      <div class="balance-stats" id="balance-stats"></div>
    </a>

    <div class="section-label">投遞記錄</div>
    <div id="sessions-list">
      <p class="empty-msg">載入中…</p>
    </div>
  </div>

  <!-- ══ Bottom tab bar ════════════════════════════════════════════ -->
  <nav class="tab-bar">
    <button class="tab-btn active" id="tab-btn-pay" onclick="switchTab('pay')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <polyline points="23 20 23 14 17 14"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
      投遞
    </button>
    <button class="tab-btn" id="tab-btn-history" onclick="switchTab('history')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3h18v4H3z"/><path d="M3 10h18"/><path d="M3 15h9"/><path d="M3 20h6"/>
      </svg>
      歷史
    </button>
  </nav>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
