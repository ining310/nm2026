AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Smart Recycling Bin — Cloud Backend

Globals:
  Function:
    Runtime: python3.11
    Timeout: 60          # IOTA tx confirmation can take tens of seconds
    CodeUri: ./          # relative to cloud/ directory (all handlers + shared/ packaged together)
    Environment:
      Variables:
        DYNAMODB_TABLE:              !Ref SessionsTable
        PROFILES_TABLE:              !Ref ProfilesTable
        IOTA_NETWORK:                devnet
        IOTA_RPC_URL:                https://indexer.devnet.iota.cafe
        IOTA_EXPLORER_BASE:          https://explorer.rebased.iota.org
        IOTA_REWARD_AMOUNT_MIST:     "3000000000"   # 3 IOTA
        LINE_CHANNEL_ACCESS_TOKEN:
          !Sub "{{resolve:ssm:/recycling/line_token:1}}"
        IOTA_MACHINE_PRIVATE_KEY_HEX:
          !Sub "{{resolve:ssm:/recycling/iota_private_key_hex:1}}"
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin:  "'*'"

Resources:

  # ── Lambda functions ────────────────────────────────────────────────────────

  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler:     history_handler.handler
      Description: Return recycling history for a wallet address
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path:   /history
            Method: get

  BalanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler:     balance_handler.handler
      Description: Return IOTA wallet balance via RPC
      Events:
        Api:
          Type: Api
          Properties:
            Path:   /balance
            Method: get

  WalletFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler:     wallet_handler.handler
      Description: Get stored wallet address for a LINE user
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProfilesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path:   /wallet
            Method: get

  PayFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler:     pay_handler.handler
      Description: Confirm payment; write DDB session; push LINE message
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfilesTable
      Events:
        Api:
          Type: Api
          Properties:
            Path:   /pay
            Method: post

  CheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler:     check_handler.handler
      Description: RPi button tamper-proof payment check
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path:   /check
            Method: get

  ResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler:     result_handler.handler
      Timeout:     120     # IOTA tx can take >60s; override global
      Description: Receive AI result; send IOTA reward; push LINE message
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        Api:
          Type: Api
          Properties:
            Path:   /result
            Method: post

  # ── DynamoDB table ──────────────────────────────────────────────────────────

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:    recycling-sessions
      BillingMode:  PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: session_id,   AttributeType: S }
        - { AttributeName: machine_id,   AttributeType: S }
        - { AttributeName: status,       AttributeType: S }
        - { AttributeName: user_line_id,        AttributeType: S }
        - { AttributeName: created_at,          AttributeType: N }
        - { AttributeName: user_wallet_address, AttributeType: S }
      KeySchema:
        - { AttributeName: session_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: machine_id-status-index
          KeySchema:
            - { AttributeName: machine_id, KeyType: HASH }
            - { AttributeName: status,     KeyType: RANGE }
          Projection:
            ProjectionType: ALL
        - IndexName: user_line_id-created_at-index
          KeySchema:
            - { AttributeName: user_line_id, KeyType: HASH }
            - { AttributeName: created_at,   KeyType: RANGE }
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: user_wallet_address-created_at-index
          KeySchema:
            - { AttributeName: user_wallet_address, KeyType: HASH }
            - { AttributeName: created_at,          KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  # ── DynamoDB user profiles table ────────────────────────────────────────────

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:   recycling-user-profiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: line_user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: line_user_id, KeyType: HASH }

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  TableName:
    Description: DynamoDB sessions table
    Value: !Ref SessionsTable
